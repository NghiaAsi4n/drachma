<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Olympus Finance</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Olympus Finance">
<meta name="theme-color" content="#1f2220">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button class="nav-btn" id="prev" aria-label="Previous month">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div id="title" class="title"></div>
    <button class="nav-btn" id="next" aria-label="Next month">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </header>

  <main id="view" tabindex="-1"></main>

  <button id="fab" aria-label="Add expense">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav id="tabbar" aria-label="Main">
    <a href="#/overview" data-tab="overview">
      <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-9z" fill="currentColor" stroke="none"/><path d="M14.5 2.6A9 9 0 0 1 21.4 9.5h-6.9z" fill="currentColor" stroke="none"/></svg>
      <span>Overview</span>
    </a>
    <a href="#/history" data-tab="history">
      <svg viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1.3" fill="currentColor"/><circle cx="4" cy="12" r="1.3" fill="currentColor"/><circle cx="4" cy="18" r="1.3" fill="currentColor"/></svg>
      <span>History</span>
    </a>
    <a href="#/analytics" data-tab="analytics">
      <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M6 15l4-4 3 3 6-7"/><path d="M15 7h4v4"/></svg>
      <span>Analytics</span>
    </a>
    <a href="#/settings" data-tab="settings">
      <svg viewBox="0 0 24 24"><path d="M5 4h14M7.5 4L9 8h6l1.5-4"/><path d="M9.5 8v9M14.5 8v9"/><path d="M5 17h14M7 20h10"/></svg>
      <span>Settings</span>
    </a>
  </nav>

  <div id="scrim" hidden></div>
  <section id="sheet" role="dialog" aria-modal="true" hidden></section>
  <div id="toast" role="status" hidden></div>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
